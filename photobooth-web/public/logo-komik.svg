<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96" role="img" aria-label="Kentamal Booth">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B85F0"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <!-- Comic starburst behind camera badge -->
  <path d="M62 6 L69 18 L83 12 L79 27 L94 29 L83 39 L96 49 L80 52 L85 67 L70 61 L64 76 L55 63 L41 73 L40 57 L24 58 L30 43 L15 41 L26 31 L14 21 L30 20 L27 5 L43 11 L50 -2 Z"
        transform="translate(12 4)"
        fill="#FFCF3F" stroke="#241D3D" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Camera badge -->
  <circle cx="74" cy="44" r="25" fill="url(#lens)" stroke="#241D3D" stroke-width="4"/>
  <g transform="translate(74 44)" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="-13" y="-8" width="26" height="18" rx="4.5"/>
    <path d="M-6.5 -8 L-4 -13 L4 -13 L6.5 -8"/>
    <circle cx="0" cy="1" r="6"/>
    <circle cx="8" cy="-3.5" r="1.2" fill="#fff" stroke="none"/>
  </g>
  <circle cx="74" cy="45" r="2.4" fill="#FFCF3F" stroke="none"/>

  <!-- Flash spark -->
  <path d="M104 16 L108.5 8 L111 16 L119 19 L111 22 L108.5 30 L106 22 L98 19 Z"
        fill="#fff" stroke="#241D3D" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <g font-family="'Arial Black','Segoe UI Black','Segoe UI',sans-serif" font-weight="900" text-anchor="middle">
    <text x="228" y="46" font-size="26" letter-spacing="1.5"
          fill="#FFCF3F" stroke="#241D3D" stroke-width="6" paint-order="stroke">KENTAMAL</text>
    <text x="228" y="46" font-size="26" letter-spacing="1.5"
          fill="#FFFFFF" stroke="#241D3D" stroke-width="0" paint-order="stroke">KENTAMAL</text>
    <text x="228" y="74" font-size="15" letter-spacing="7.5"
          fill="#4F46E5" stroke="#241D3D" stroke-width="2.4" paint-order="stroke">BOOTH</text>
  </g>

  <!-- Halftone accent -->
  <g fill="#241D3D" opacity="0.3">
    <circle cx="322" cy="84" r="1.6"/><circle cx="331" cy="84" r="1.6"/><circle cx="340" cy="84" r="1.6"/>
    <circle cx="326.5" cy="91" r="1.6"/><circle cx="335.5" cy="91" r="1.6"/>
  </g>
</svg>
